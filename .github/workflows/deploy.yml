name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate the public site
        run: |
          node scripts/validate-site.mjs
          node scripts/test-inquiry-analytics.mjs
          node scripts/test-ad-measurement.mjs
      - name: Stage public pages and assets
        run: |
          mkdir -p _site/assets _site/tutorbird _site/docs/discovery
          cp *.html *.css *.js favicon.svg robots.txt sitemap.xml CNAME _site/
          cp tutorbird/index.html _site/tutorbird/
          cp docs/discovery/resource-index.json _site/docs/discovery/
          cp assets/lokahi-connect-logo.png assets/stephanie-steinshouer-headshot.jpg _site/assets/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
